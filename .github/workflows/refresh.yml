name: Refresh games

# Re-discovers games from RAWG + Steam weekly so new releases appear
# automatically. Commits the regenerated dataset, which triggers Vercel's
# auto-deploy. Can also be run on demand from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write # so a failed run can raise (and later close) an alert issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Discover games from RAWG
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: npm run data

      - name: Add Steam player sentiment
        run: npm run enrich

      - name: Sanity-check the dataset
        run: npm test

      - name: Commit if the dataset changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/games.json; then
            echo "No changes — nothing to deploy."
          else
            git add src/data/games.json
            git commit -m "chore: weekly RAWG + Steam refresh"
            git push
          fi

      # A cron that fails quietly is a cron you can't trust: this one went down
      # for three weeks (RAWG returned 522) with no signal at all. These two
      # steps make the pipeline say so — GitHub emails on issue activity, so the
      # open issue IS the alert. One issue is reused rather than a new one
      # weekly, and it self-closes once a run succeeds again.
      - name: Raise an alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 Weekly game refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match over the open list, not `--search`: GitHub's search
          # index lags by seconds-to-minutes and would let duplicates through.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          body="The scheduled \`refresh.yml\` run failed, so \`src/data/games.json\` is now stale and the live site is serving the last good dataset.

          Failed run: $RUN_URL

          Check the log for the \`RAWG preflight failed:\` line — it names the cause (auth / quota / upstream outage) and what to do about it.

          This issue closes itself automatically once a run succeeds."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      - name: Close the alert issue once healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 Weekly game refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match over the open list, not `--search`: GitHub's search
          # index lags by seconds-to-minutes and would let duplicates through.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered — refresh succeeded in $RUN_URL"
          fi
