name: Refresh games

# Rebuilds the board from Steam weekly so new releases appear automatically.
# Commits the regenerated dataset, which triggers Vercel's auto-deploy. Can
# also be run on demand from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write # so a failed run can raise (and later close) an alert issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Exits 75 (EX_TEMPFAIL) for transient upstream trouble — preflight
      # failure, rate-limit budget trip, or a board too small to trust — and
      # leaves the live dataset untouched in all three cases. Exit 1 means a
      # real code fault. Both are failures here, and both must alert: a run
      # that silently does nothing is exactly what this workflow guards against.
      - name: Rebuild the board from Steam
        run: npm run data

      - name: Promote the candidate
        run: mv src/data/games.candidate.json src/data/games.json

      - name: Sanity-check the dataset
        run: npm test

      # Both paths must be committed. data/steam-meta.json is the Steam metadata
      # cache that turns a ~2.5-hour cold build into a few minutes of weekly
      # maintenance; Actions checks out fresh every run, so leaving it behind
      # would re-pay hours of API calls (and get rate-limited) every Monday.
      # The cache legitimately advances on runs where the board does not, hence
      # the staged-diff check across both files rather than games.json alone.
      - name: Commit if the board or the metadata cache changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/games.json data/steam-meta.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to deploy."
          else
            git commit -m "chore: weekly Steam refresh"
            git push
          fi

      # A cron that fails quietly is a cron you can't trust: this one went down
      # for three weeks (the old upstream returned 522) with no signal at all.
      # These two steps make the pipeline say so — GitHub emails on issue
      # activity, so the open issue IS the alert. One issue is reused rather
      # than a new one weekly, and it self-closes once a run succeeds again.
      #
      # `cancelled()` is not optional: a job that blows through timeout-minutes
      # is cancelled, NOT failed, so `failure()` alone would skip this step and
      # recreate the silent outage above.
      - name: Raise an alert issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 Weekly game refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match over the open list, not `--search`: GitHub's search
          # index lags by seconds-to-minutes and would let duplicates through.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          body="The scheduled \`refresh.yml\` run failed, so \`src/data/games.json\` is now stale and the live site is serving the last good dataset.

          Failed run: $RUN_URL

          Check the log for the \`SteamSpy preflight failed:\` or \`Steam preflight failed:\` line — it names which upstream is down.

          This issue closes itself automatically once a run succeeds."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      - name: Close the alert issue once healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "🔴 Weekly game refresh is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match over the open list, not `--search`: GitHub's search
          # index lags by seconds-to-minutes and would let duplicates through.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered — refresh succeeded in $RUN_URL"
          fi
